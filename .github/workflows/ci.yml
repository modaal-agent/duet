# The framework's own gate (F4 CI templates): both flavor suites + the
# flavor-lockstep lint. Committed while the repo is still private — these jobs
# first run for real at the public flip; until then the same commands are the
# local gate (CONTRIBUTING "Building") and the Modaal-free receipt runs them
# from clean clones.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # The dedicated Xcode-27 preview image — its DEFAULT Xcode is the 27 beta
    # line (Swift 6.4), the toolchain the framework's strict-concurrency
    # guarantees are proven on (locally: Xcode 27 beta 2). These are proofs
    # against a specific frontend, not "any new-enough Xcode": older ones fail
    # honestly (macos-15's default — and macos-26's 26.5 — cannot prove the
    # non-Sendable Action region transfer in Store's stream hop). When the
    # Xcode 27 GA reaches the macos-26 image, move there and pin the exact
    # version with setup-xcode.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Swift flavor (framework suites; replays swift/Tests/parity/fixtures)
        run: swift test

  kotlin:
    # macOS: the KMP module declares apple targets (macosArm64/ios*) — a Linux
    # host would silently disable them. Pure KMP, no Android SDK needed.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin flavor (KMP suites)
        run: cd kotlin && ./gradlew test --console=plain

  flavor-lockstep:
    # Development rule 1: the two core flavors share one contract surface.
    # Coverage + pair surfaces + ledger freshness; zero-dep python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: flavor-lockstep lint
        run: python3 scripts/flavor-lockstep-lint.py
