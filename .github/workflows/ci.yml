# The framework's own gate (F4 CI templates): both flavor suites + the
# flavor-lockstep lint. Committed while the repo is still private — these jobs
# first run for real at the public flip; until then the same commands are the
# local gate (CONTRIBUTING "Building") and the Modaal-free receipt runs them
# from clean clones.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # Two lanes, one per audience. macos-26 pinned to Xcode 26.6 = the GA line
    # and the VERIFIED adopter floor (Swift 6.3.3; needs the documented
    # KernelTrace suppression — its sending analysis reports a phantom
    # use-after-send that 6.4 proves safe unaided). xcode-27 = the newest line
    # (the image's default Xcode IS the pin: 27 beta, Swift 6.4, the toolchain
    # the strict-concurrency proofs are made on). Strict-concurrency
    # guarantees are proofs against a specific frontend, so both pins are
    # explicit; macos-15's default is below the floor (it rejects even Store's
    # stream hop). fail-fast off: one lane's verdict must not hide the other's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macos-26
            xcode: "26.6"
          - image: xcode-27
            xcode: ""
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Swift flavor (framework suites; replays swift/Tests/parity/fixtures)
        run: swift test

  kotlin:
    # macOS: the KMP module declares apple targets (macosArm64/ios*) — a Linux
    # host would silently disable them. Pure KMP, no Android SDK needed.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin flavor (KMP suites)
        run: cd kotlin && ./gradlew test --console=plain

  flavor-lockstep:
    # Development rule 1: the two core flavors share one contract surface.
    # Coverage + pair surfaces + ledger freshness; zero-dep python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: flavor-lockstep lint
        run: python3 scripts/flavor-lockstep-lint.py
