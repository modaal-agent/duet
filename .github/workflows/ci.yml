# The framework's own gate: both flavor suites + the flavor-lockstep lint.
# The same commands are the local gate (CONTRIBUTING "Building").
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # Two lanes, one per audience. macos-26 pinned to Xcode 26.6 = the GA line
    # and the VERIFIED adopter floor (Swift 6.3.3; needs the documented
    # KernelTrace suppression — its sending analysis reports a phantom
    # use-after-send that 6.4 proves safe unaided). xcode-27 = the newest line
    # (the image's default Xcode IS the pin: 27 beta, Swift 6.4, the toolchain
    # the strict-concurrency proofs are made on). Strict-concurrency
    # guarantees are proofs against a specific frontend, so both pins are
    # explicit; macos-15's default is below the floor (it rejects even Store's
    # stream hop). fail-fast off: one lane's verdict must not hide the other's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macos-26
            xcode: "26.6"
          - image: xcode-27
            xcode: ""
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Swift flavor (framework suites; replays swift/Tests/parity/fixtures)
        id: tests
        run: swift test
      - name: Job summary
        if: always()
        run: |
          {
            echo "### swift · ${{ matrix.image }} — ${{ steps.tests.outcome == 'success' && '✅ passed' || '❌ failed' }}"
            echo ""
            echo "- toolchain: $(xcodebuild -version | tr '\n' ' ')"
            echo "- swift: $(swift --version 2>&1 | head -1)"
            echo "- lane: ${{ matrix.xcode != '' && 'the GA floor (pinned)' || 'the newest proven line (image default)' }}"
            echo "- suites: framework tests replaying \`swift/Tests/parity/fixtures\` (the repo's own corpus)"
          } >> "$GITHUB_STEP_SUMMARY"

  kotlin:
    # macOS: the KMP module declares apple targets (macosArm64/ios*) — a Linux
    # host would silently disable them. Pure KMP, no Android SDK needed.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin flavor (KMP suites)
        id: tests
        run: cd kotlin && ./gradlew test --console=plain
      - name: Job summary
        if: always()
        run: |
          {
            echo "### kotlin — ${{ steps.tests.outcome == 'success' && '✅ passed' || '❌ failed' }}"
            echo ""
            echo "- jdk: $(java -version 2>&1 | head -1)"
            echo "- suites: \`:kernel\` / \`:kernel-test\` / \`:shells-compose\` KMP tests (pure KMP — no Android SDK, no emulator)"
          } >> "$GITHUB_STEP_SUMMARY"

  flavor-lockstep:
    # Development rule 1: the two core flavors share one contract surface.
    # Coverage + pair surfaces + ledger freshness; zero-dep python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: flavor-lockstep lint
        id: lint
        # Explicit `shell: bash` turns pipefail ON (the default run shell does
        # not) — without it the tee would mask a lint failure.
        shell: bash
        run: python3 scripts/flavor-lockstep-lint.py | tee lint-output.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "### flavor-lockstep — ${{ steps.lint.outcome == 'success' && '✅ ok' || '❌ failed' }}"
            echo ""
            echo '```'
            cat lint-output.txt 2>/dev/null || echo "(lint produced no output)"
            echo '```'
            echo "- gate: closed coverage + pair surfaces + ledger freshness (\`parity/flavor-parity.yaml\` → \`parity/flavor-parity-ledger.md\`)"
          } >> "$GITHUB_STEP_SUMMARY"
