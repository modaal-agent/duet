# The agent skill's gate: skills/duet/, the plugin manifests and the eval cases
# (scripts/check-skill.sh, checks C1–C15; C14 fails a change under skills/ that
# leaves the plugin's version where it was, C15 a file under skills/ of a type
# the plugin directory refuses), and the checker's own self-test.
# check-skill.sh clones duet-tools and duet-services and reads their newest tags. The weekly run fails within a week
# of a release that renames or removes a verb, an MCP tool or a product the
# skill names. A diagnostic the skill quotes that only an older duet-tools tag
# prints is a C11 note, which the run prints and does not fail on.
name: skill

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # C14 finds the commit that set the plugin's version
      - name: check-skill
        run: scripts/check-skill.sh
      - name: check-skill self-test
        run: scripts/check-skill.sh --self-test
